services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uk_wind_analytics_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/wind_analytics.db
      - CORS_ORIGINS=["*"]
    restart: unless-stopped
